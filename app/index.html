<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zak Roll</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout : une colonne étroite comme une feuille de service. Scripts = bulles pliables (À faire / Terminé) ; hooks = claquettes pliables à cocher ; body et CTA = mêmes cartes, sans case. Le propriétaire édite en place dans les bulles (vue Cartes), selon « Pour qui ». */
:root {
  --page: #ECEEF1;
  --card: #FFFFFF;
  --ink: #111419;
  --muted: #59606C;
  --line: #D2D7DE;
  --track: #D2D7DE;
  --soft: #F3F4F6;
  --rec: #CF2A1D;
  --on-rec: #FFFFFF;
  --done: #11743A;
  --on-done: #FFFFFF;
  --done-bg: #DFF2E5;
  --warn: #855000;
  --warn-bg: #FFEFC2;
  --btn: #111419;
  --btn-ink: #FFFFFF;
  --focus: #2C5AE0;
  --shade: rgb(17 20 25 / .07);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0D0F12; --card: #171A1F; --ink: #F0F2F4; --muted: #9AA2AE; --line: #2B3038; --track: #363C46; --soft: #1D2127;
    --rec: #FF5A4D; --on-rec: #0D0F12; --done: #45C978; --on-done: #0D0F12; --done-bg: #132E1F;
    --warn: #F2B53F; --warn-bg: #38290A; --btn: #F0F2F4; --btn-ink: #0D0F12; --focus: #7FA3FF;
    --shade: rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0D0F12; --card: #171A1F; --ink: #F0F2F4; --muted: #9AA2AE; --line: #2B3038; --track: #363C46; --soft: #1D2127;
  --rec: #FF5A4D; --on-rec: #0D0F12; --done: #45C978; --on-done: #0D0F12; --done-bg: #132E1F;
  --warn: #F2B53F; --warn-bg: #38290A; --btn: #F0F2F4; --btn-ink: #0D0F12; --focus: #7FA3FF;
  --shade: rgb(0 0 0 / .35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
main { display: block; }

.frame { max-width: 680px; margin: 0 auto; }
.frame.wide { max-width: 820px; }
.top { padding-top: 14px; }
.clap {
  height: 14px;
  border: 2px solid var(--ink);
  border-radius: 4px 4px 2px 2px;
  background: repeating-linear-gradient(-58deg, var(--ink) 0 11px, var(--card) 11px 22px);
}
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding-top: 6px; }
.brand-name { font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.lnk {
  background: none; border: 0; padding: 8px 0; color: var(--ink); cursor: pointer;
  font-weight: 700; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px;
}
.lnk.subtle { color: var(--muted); font-size: 14px; }
.lnk.back {
  display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px 0 10px;
  border: 1.5px solid var(--line); border-radius: 99px; text-decoration: none; font-size: 15px;
}
.lnk.back:hover { border-color: var(--ink); }
.saved { font-size: 13px; font-weight: 700; color: var(--done); opacity: 0; transition: opacity .3s; }
.saved.on { opacity: 1; }

/* ---- Accueil ---- */
.home { display: grid; gap: 16px; padding: 12px 0 8px; }
.cgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ccard {
  display: flex; flex-direction: column; align-items: stretch; gap: 12px; width: 100%; min-width: 0;
  padding: 18px 16px 16px; text-align: left; cursor: pointer;
  background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: 14px;
  box-shadow: 0 1px 2px var(--shade), 0 3px 12px var(--shade);
  transition: border-color .15s, transform .1s;
}
.ccard:hover { border-color: var(--ink); }
.ccard:active { transform: scale(.985); }
.cname { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 8vw, 36px); line-height: 1; overflow-wrap: anywhere; }
.ccard .bar { display: block; }
.cstate { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1; letter-spacing: .1em; text-transform: uppercase; color: var(--rec); font-variant-numeric: tabular-nums; }
.ccard.is-complete .cstate { color: var(--done); }

/* ---- Page courtier ---- */
.hero { padding: 10px 0 16px; display: grid; gap: 10px; }
.hi { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(32px, 9vw, 44px); line-height: 1; overflow-wrap: anywhere; }
.meter { display: flex; align-items: center; gap: 12px; }
.bar { height: 10px; border-radius: 99px; background: var(--track); overflow: hidden; }
.meter .bar { flex: 1; }
.bar > i { display: block; height: 100%; background: var(--done); border-radius: inherit; transition: width .35s ease; }
.frac { font-family: var(--f-display); font-weight: 700; font-size: 20px; white-space: nowrap; font-variant-numeric: tabular-nums; }

.sect { margin: 18px 0 10px; font-family: var(--f-display); font-weight: 700; font-size: 15px; line-height: 1; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sbub { margin-bottom: 12px; border: 1.5px solid var(--line); border-radius: 16px; background: color-mix(in srgb, var(--card) 45%, var(--page)); min-width: 0; }
.sbhd {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 8px 14px 8px 10px;
  border: 0; border-radius: 15px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.sbhd .slate { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sbhd .frac { margin-left: auto; font-size: 18px; }
.sbub.open .sbhd .tri { transform: rotate(180deg); }
.sbub.is-done .sbhd .slate { background: var(--done); color: var(--on-done); }
.sbub.is-done .sbhd .frac { color: var(--done); }
.sbin { display: grid; gap: 10px; padding: 0 10px 12px; }
.btn.dep { width: 100%; min-height: 50px; font-size: 16px; background: var(--rec); color: var(--on-rec); border-color: var(--rec); }
.btn.dep:hover { background: color-mix(in srgb, var(--rec) 86%, var(--ink)); }

/* Choix de vue */
.vbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 4px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--card); border: 1px solid var(--line); }
.segb { min-height: 34px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 700; font-size: 14px; cursor: pointer; }
.segb[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }

/* Vue Texte (dans la même bulle que les cartes) : étiquette sur sa ligne, texte dessous, une ligne vide entre les blocs */
.doc { padding: 18px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.dblk + .dblk { margin-top: 24px; }
.dhead { display: flex; align-items: center; gap: 10px; margin: 0; min-height: 30px; }
.dblk.open .dhead { margin-bottom: 6px; }
.dfold { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; border-radius: 6px; }
.dfold:focus-visible { outline-offset: 3px; }
.dblk.open .dfold .tri { transform: rotate(180deg); }
.dlab { font-family: var(--f-display); font-weight: 700; font-size: 25px; line-height: 1; letter-spacing: .03em; color: var(--ink); }
.dblk.is-done .dlab { color: var(--done); }
.dblk.is-redo .dlab { color: var(--warn); }
.dtxt { margin: 0; font-size: 18px; line-height: 1.55; white-space: pre-line; overflow-wrap: anywhere; }
.dck {
  appearance: none; -webkit-appearance: none; display: inline-grid; place-content: center; flex: none;
  width: 28px; height: 28px; margin: 0; border: 2px solid var(--ink); border-radius: 7px; background: var(--card); cursor: pointer;
}
.dck::after { content: ""; width: 11px; height: 6px; opacity: 0; border-left: 3px solid var(--on-done); border-bottom: 3px solid var(--on-done); transform: translateY(-1px) rotate(-45deg); }
.dck:checked { background: var(--done); border-color: var(--done); }
.dck:checked::after { opacity: 1; }
.dck:disabled { opacity: .4; cursor: not-allowed; }

/* Choix des scripts à imprimer */
.picks { display: grid; gap: 8px; }
.pick { background: var(--card); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.prow { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 14px; }
.plabel { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 52px; cursor: pointer; }
.plabel .slate { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pst { margin-left: auto; font-family: var(--f-display); font-weight: 700; font-size: 18px; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
.pst.ok { color: var(--done); }
.ptri { flex: none; width: 44px; height: 44px; display: grid; place-content: center; padding: 0; border: 0; border-radius: 10px; background: transparent; cursor: pointer; }
.ptri:hover { background: var(--soft); }
.pick.open .ptri .tri { transform: rotate(180deg); }
.pprev { padding: 4px 16px 16px; border-top: 1px solid var(--line); }
.pprev .dblk { margin-top: 16px; }
.pprev .dlab { font-size: 20px; }
.pprev .dtxt { font-size: 16px; }
.pgo { display: grid; gap: 10px; margin-top: 16px; }
.pgo .btn { min-height: 48px; }

/* Vue Impression : noir sur blanc, sans contrôle */
.pbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 0; }
.pnote { margin: 0; font-size: 14px; color: var(--muted); }
.pdoc { padding: 30px 24px; background: #fff; color: #000; border: 1px solid var(--line); border-radius: 6px; font-family: var(--f-body); }
.psec + .psec { margin-top: 44px; }
.ph { margin: 0 0 18px; font-size: 30px; line-height: 1.1; }
.plab { margin: 0; font-weight: 700; font-size: 15px; letter-spacing: .04em; }
.ptxt { margin: 2px 0 20px; font-size: 20px; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; }
@media print {
  body { background: #fff !important; color: #000 !important; padding: 0 !important; }
  .noprint, .toast { display: none !important; }
  .pdoc { padding: 0; border: 0; border-radius: 0; }
  .psec + .psec { margin-top: 0; break-before: page; page-break-before: always; }
  .ph { font-size: 22pt; }
  .ptxt { font-size: 15pt; }
}

.clip {
  display: grid; grid-template-columns: minmax(0, 1fr) 72px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  box-shadow: 0 1px 2px var(--shade), 0 3px 12px var(--shade);
}
.clip.read { grid-template-columns: minmax(0, 1fr); }
.cbody { padding: 12px 10px 12px 14px; min-width: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.cbody:focus-visible { outline-offset: -3px; }
.tag { display: flex; align-items: center; gap: 6px 8px; min-height: 30px; }
.tag .fname { flex: 1 1 auto; min-width: 0; }
.tri { flex: none; display: inline-grid; place-content: center; width: 22px; height: 22px; color: var(--muted); transition: transform .2s; }
.clip.open .tri { transform: rotate(180deg); }
.slate {
  display: inline-block; background: var(--ink); color: var(--card); border-radius: 5px;
  font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1; letter-spacing: .08em; text-transform: uppercase;
  padding: 5px 9px 4px; white-space: nowrap; flex: none;
}
.slate.big { font-size: 20px; text-transform: none; letter-spacing: .04em; }
.clip.is-done .slate { background: var(--done); color: var(--on-done); }
.fname { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.txt { margin: 8px 0 2px; font-size: 19px; line-height: 1.45; white-space: pre-line; overflow-wrap: anywhere; }
.tick { display: flex; align-items: center; justify-content: center; border-left: 1px solid var(--line); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tick:hover { background: var(--soft); }
.tick input {
  appearance: none; -webkit-appearance: none; margin: 0; width: 40px; height: 40px; cursor: pointer;
  border: 2.5px solid var(--ink); border-radius: 10px; background: var(--card);
  display: grid; place-content: center; transition: background .15s, border-color .15s;
}
.tick input::after {
  content: ""; width: 18px; height: 10px; opacity: 0;
  border-left: 4px solid var(--on-done); border-bottom: 4px solid var(--on-done);
  transform: translateY(-2px) rotate(-45deg);
}
.tick input:checked { background: var(--done); border-color: var(--done); }
.tick input:checked::after { opacity: 1; }
.tick input:disabled { opacity: .4; cursor: not-allowed; }
.clip.is-redo { border-color: var(--warn); }
.cards { display: grid; gap: 10px; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none;
  font-family: var(--f-body); font-weight: 700; font-size: 13px; line-height: 1; letter-spacing: 0; text-transform: none;
  padding: 5px 9px; border-radius: 99px; background: var(--soft); color: var(--muted); border: 1px solid var(--line);
}
.pill.ok { background: var(--done-bg); color: var(--done); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }

/* ---- Boutons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px;
  border-radius: 10px; border: 1.5px solid var(--ink); background: var(--card); color: var(--ink);
  font-weight: 700; font-size: 15px; line-height: 1.15; text-align: center; text-decoration: none; cursor: pointer;
}
.btn:hover { background: var(--soft); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 9px; }
.btn.ghost { border-color: var(--line); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn.danger { color: var(--rec); border-color: color-mix(in srgb, var(--rec) 50%, var(--line)); }
.btn.danger.armed { background: var(--rec); color: var(--on-rec); border-color: var(--rec); }
.ib {
  width: 34px; height: 34px; display: inline-grid; place-content: center; flex: none; padding: 0;
  border: 0; border-radius: 8px; background: transparent; color: var(--muted);
  font-size: 16px; font-weight: 700; cursor: pointer;
}
.ib:hover:not(:disabled) { background: var(--soft); color: var(--ink); }
.ib.trash:hover:not(:disabled) { color: var(--rec); }
.ib:disabled { opacity: .3; cursor: default; }
.plus {
  display: block; width: 100%; min-height: 44px; border: 1.5px dashed var(--line); border-radius: 12px; cursor: pointer;
  background: transparent; color: var(--muted); font-size: 24px; font-weight: 700; line-height: 1;
}
.plus:hover { border-color: var(--ink); color: var(--ink); }
.banner {
  margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; font-size: 15px;
  background: var(--warn-bg); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
}
.note { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.empty { margin: 18px 0; padding: 20px 18px; border-radius: 14px; background: var(--card); border: 1.5px dashed var(--line); color: var(--muted); }
.empty p { margin: 0; }

/* ---- Gérer ---- */
.mtop { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0 14px; }
.h1 { margin: 6px 0 14px; font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 6vw, 36px); line-height: 1; }
.mlist { display: grid; gap: 10px; margin-bottom: 12px; }
.hcard { display: flex; align-items: center; gap: 4px; padding: 4px 6px 4px 4px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); min-width: 0; }
.hcard:hover { border-color: var(--ink); }
.hopen {
  flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; text-align: left; cursor: pointer;
  padding: 10px 10px; border: 0; background: transparent; color: var(--ink);
}
.mtitle { font-weight: 700; overflow-wrap: anywhere; }
.tools { display: inline-flex; align-items: center; gap: 2px; flex: none; margin-left: auto; }
.panel { display: grid; gap: 10px; padding: 14px; margin-bottom: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.shead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.shead .codewrap { flex: 1 1 110px; min-width: 0; }
.shead .envwrap { flex: 0 1 110px; min-width: 80px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pillb {
  min-height: 32px; padding: 0 12px; border-radius: 99px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--card); color: var(--muted); font-weight: 700; font-size: 14px;
}
.pillb[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.pillb.add { border-style: dashed; font-weight: 600; }
.pillb:hover { border-color: var(--ink); }
.list { display: grid; gap: 10px; }
.list + .list { margin-top: 18px; }
.addk {
  justify-self: start; min-height: 38px; padding: 0 14px; border-radius: 99px; cursor: pointer;
  border: 1.5px dashed var(--line); background: transparent; color: var(--muted); font-weight: 700; font-size: 14px;
}
.addk:hover { border-color: var(--ink); color: var(--ink); }
/* Propriétaire : pastilles des courtiers (qui a quoi, qui a tourné), versions en sous-lignes, vue « Tous » */
.bp {
  min-width: 30px; height: 30px; padding: 0 8px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--card);
  color: var(--muted); font-size: 13px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer;
  -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
}
.bp:hover:not(:disabled) { border-color: var(--ink); }
.bp.on { background: var(--ink); border-color: var(--ink); color: var(--card); }
.bp.ok { background: var(--done); border-color: var(--done); color: var(--on-done); }
.bp.na { border-style: dashed; opacity: .4; cursor: not-allowed; }
.spills { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 12px 10px 36px; }
.rpills { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 6px; }
.rpills .fname { margin-left: auto; max-width: 48%; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clip.own { display: block; padding: 10px 10px 12px 12px; }
.vrow + .vrow { margin-top: 12px; }
.vrow.sub { margin-left: 12px; padding-left: 10px; border-left: 3px solid var(--warn); }
.vrow.sub .slate { background: var(--warn); color: var(--card); }
.vrow.sub .dlab { color: var(--warn); }
.rhead { display: flex; align-items: center; gap: 6px; min-height: 34px; min-width: 0; }
.rtools { margin-left: auto; display: inline-flex; align-items: center; flex: none; }
.rtools .ib { width: 30px; }
.vrow.is-done .slate { background: var(--done); color: var(--on-done); }
.vrow.is-done .dlab { color: var(--done); }
.vrow .txtin { margin-top: 8px; }
.verch { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin: 8px 0 0; padding: 6px 8px; border-radius: 10px; background: var(--warn-bg); }
.verch .fl { margin-right: 4px; color: var(--warn); }
.tip { position: fixed; z-index: 40; max-width: 150px; padding: 6px 10px; border-radius: 8px; background: var(--btn); color: var(--btn-ink); font-size: 13px; font-weight: 700; pointer-events: none; }
.abars { display: grid; gap: 4px; }
.arow { display: grid; grid-template-columns: minmax(56px, auto) 1fr auto; align-items: center; gap: 12px; min-height: 40px; padding: 2px 0; border: 0; background: none; color: var(--ink); text-align: left; cursor: pointer; }

    const src = Array.isArray(s.items) ? s.items : Array.isArray(s.clips) ? s.clips : [];
    o.items = src.filter((it) => it && typeof it === "object" && isStr(it.id)).map(normItem);
    delete o.clips;
    return o;
  }
  function norm(c) {
    if (!c || typeof c !== "object") return null;
    const str = (v, d) => (typeof v === "string" ? v : v == null ? d : String(v));
    const out = Object.assign({}, c);
    out.v = 2;
    out.brokers = (Array.isArray(c.brokers) ? c.brokers : [])
      .filter((b) => b && typeof b === "object" && isStr(b.id))
      .map((b) => Object.assign({}, b, { name: str(b.name, "") || b.id, drive: str(b.drive, "") }));
    out.scripts = (Array.isArray(c.scripts) ? c.scripts : [])
      .filter((s) => s && typeof s === "object" && isStr(s.id)).map(normScript);
    out.commonDrive = str(c.commonDrive, "");
    out.appUrl = str(c.appUrl, "");
    delete out.order;
    return out;
  }
  const C = () => S.content || emptyContent();
  const allBids = () => C().brokers.map((b) => b.id);
  const brokerName = (bid) => { const b = C().brokers.find((x) => x.id === bid); return b ? b.name : bid; };
  const names = (ids) => listFr(ids.map(brokerName));
  const findScript = (sid) => C().scripts.find((s) => s.id === sid) || null;
  function findItem(iid) {
    for (const s of C().scripts) { const it = s.items.find((x) => x.id === iid); if (it) return { s, it }; }
    return null;
  }

  // Attribution : to = "all" (tout le monde sauf `not`) ou liste explicite.
  const has = (x, b) => (Array.isArray(x.to) ? x.to.indexOf(b) >= 0 : (x.not || []).indexOf(b) < 0);
  function include(x, b) {
    if (Array.isArray(x.to)) { if (x.to.indexOf(b) < 0) x.to.push(b); }
    else x.not = (x.not || []).filter((y) => y !== b);
  }
  function exclude(x, b) {
    if (Array.isArray(x.to)) x.to = x.to.filter((y) => y !== b);
    else { x.not = x.not || []; if (x.not.indexOf(b) < 0) x.not.push(b); }
  }
  const audOf = (n, s) => n.brokers.map((b) => b.id).filter((b) => has(s, b));
  const holdOf = (n, s, it) => audOf(n, s).filter((b) => has(it, b));
  const audience = (s) => audOf(C(), s);
  const holders = (s, it) => holdOf(C(), s, it);
  // Ce que le courtier voit : ses versions, sans les éléments encore vides.
  function visibleItems(s, bid) {
    const seen = {};
    return s.items.filter((it) => { if (!has(it, bid) || seen[it.key] || !it.text.trim()) return false; seen[it.key] = 1; return true; });
  }
  const versionFor = (s, key, bid) => s.items.find((it) => it.key === key && has(it, bid)) || null;
  // Nom du script : code et environnement (« test1-Car »).
  const scriptLabel = (s) => (s.code || s.title || "script") + (s.env ? "-" + s.env : "");
  const itemLabel = (it) => (it.kind === "hook" ? "HK" + (it.num != null ? it.num : "?") : it.label || (it.kind === "cta" ? "CTA" : "Body"));
  const clipName = (bName, s, it) => bName + "-" + (s.code || "script") + "-HK" + (it.num != null ? it.num : "?") + (s.env ? "-" + s.env : "");

  /* ---------- Coches et dépôts ---------- */
  const pend = (k) => (Object.prototype.hasOwnProperty.call(S.pending, k) ? S.pending[k] : undefined);
  function getCheck(bid, key) {
    const p = pend("c|" + bid + "|" + key);
    if (p) return p.val;
    const d = S.progress[bid];
    const v = d && d.checks && typeof d.checks === "object" ? d.checks[key] : null;
    return v && typeof v === "object" ? v : null;
  }
  // Une coche reste bonne tant que le texte du hook n'a pas changé (ou si Édouard a gardé les coches).
  function checkOk(c, it) {
    if (!c) return false;
    if (c.h != null) return c.h === th(it.text) || (it.ok || []).indexOf(c.h) >= 0;
    return num(c.rev) >= num(it.rev);
  }
  const isDone = (bid, it) => checkOk(getCheck(bid, it.key), it);
  const isRedo = (bid, it) => { const c = getCheck(bid, it.key); return !!c && !checkOk(c, it); };
  function stats(bid) {
    let total = 0, done = 0;
    for (const s of C().scripts) {
      if (!has(s, bid)) continue;
      for (const it of visibleItems(s, bid)) {
        if (it.kind !== "hook") continue;
        total++;
        if (isDone(bid, it)) done++;
      }
    }
    return { total, done, left: total - done };
  }
  function brokerLink(bid) {
    const base = safeUrl(S.content && S.content.appUrl);
    return base ? base.split("#")[0] + "#" + bid : "";
  }
  function currentBroker() {
    const c = S.content;
    if (!c || !S.route) return null;
    return c.brokers.find((b) => b.id === S.route) || null;
  }

  /* ---------- Numéros HK, codes, environnements ---------- */
  function trashItems() {
    const out = [];
    S.trash.forEach((t) => {
      try {
        if ((t.kind === "item" || t.kind === "clip") && t.item && isStr(t.item.id)) out.push(normItem(t.item));
        if (t.kind === "script" && t.item && isStr(t.item.id)) normScript(t.item).items.forEach((it) => out.push(it));
      } catch (_) {}
    });
    return out;
  }
  function allHooks(withTrash) {
    const out = [];
    C().scripts.forEach((s) => s.items.forEach((it) => { if (it.kind === "hook") out.push(it); }));
    if (withTrash) trashItems().forEach((it) => { if (it.kind === "hook") out.push(it); });
    return out;
  }
  function nextFreeNum(extra, excludeKey) {
    let max = 0;
    allHooks(true).forEach((it) => { if (it.key !== excludeKey && num(it.num) > max) max = it.num; });
    (extra || []).forEach((n) => { if (n > max) max = n; });
    return max + 1;
  }
  function similarHook(text, excludeKey) {
    if (!normText(text)) return null;
    let best = null;
    allHooks(false).forEach((it) => {
      if (it.key === excludeKey || it.num == null) return;
      const sc = likeness(text, it.text);
      if (sc > 0 && (!best || sc > best.score)) best = { num: it.num, text: it.text, score: sc, key: it.key };
    });
    return best;
  }
  function suggestCode(typed, excludeSid) {
    const t = String(typed || "").trim();
    if (!t) return "";
    const m = /^(.*?)(\d+)$/.exec(t);
    const base = m ? m[1] : t;
    if (!base) return "";
    const codes = C().scripts.filter((s) => s.id !== excludeSid).map((s) => s.code);
    S.trash.forEach((x) => { if (x.kind === "script" && x.item && isStr(x.item.code)) codes.push(x.item.code); });
    let max = 0;
    codes.filter(isStr).forEach((c) => {
      const mm = /^(.*?)(\d+)$/.exec(c);
      if (mm && mm[1].toLowerCase() === base.toLowerCase()) max = Math.max(max, parseInt(mm[2], 10));
    });
    if (!max && m) return "";
    const sug = base + (max + 1);
    return sug === t ? "" : sug;
  }
  const ENV_DEFAULT = ["Car", "Nad", "Bureau", "Home", "Dehors"];
  function envList() {
    const seen = {}, out = [];
    ENV_DEFAULT.concat(C().scripts.map((s) => s.env)).forEach((e) => {
      if (!isStr(e)) return;
      const k = e.toLowerCase();
      if (!seen[k]) { seen[k] = 1; out.push(e); }
    });
    return out;
  }

  /* Coller un script dans un hook vide : « HK1 » sur sa ligne, le texte dessous, une ligne vide entre les blocs. */
  const LABEL_ONLY = /^(?:hk|hook|body|corps|cta|intro|outro)\s*#?\s*\d{0,3}[a-z]?\s*[:.\-–—]?$/i;
  const LABEL_INLINE = /^((?:hk|hook|body|corps|cta|intro|outro)\s*#?\s*\d{0,3}[a-z]?)\s*[:\-–—]\s*(\S.*)$/i;
  function cleanLabel(s) {
    s = s.replace(/[:.\-–—\s]+$/, "").replace(/\s+/g, " ").trim();
    return s.replace(/^hk\s*#?\s*/i, "HK").replace(/^cta\b/i, "CTA").slice(0, 24);
  }
  function parseScript(raw) {
    const out = [];
    let cur = null, blank = false;
    const push = () => { if (cur && cur.text.trim()) out.push({ label: cur.label, text: cur.text.trim() }); cur = null; };
    for (const rawLine of String(raw || "").replace(/\r\n?/g, "\n").split("\n")) {
      const line = rawLine.trim();
      if (!line) { blank = true; continue; }
      let m;
      if (LABEL_ONLY.test(line)) {
        if (cur && cur.text.trim()) push();
        cur = { label: cleanLabel(line), text: "" };
      } else if ((m = LABEL_INLINE.exec(line))) {
        push();
        cur = { label: cleanLabel(m[1]), text: m[2] };
      } else {
        if (cur && blank && cur.text && !cur.label) push();
        if (!cur) cur = { label: "", text: "" };
        cur.text = cur.text ? cur.text + "\n" + line : line;
      }
      blank = false;
    }
    push();
    return out.map((k) => {
      const kind = k.label ? kindOf(k.label) : "hook";
      return { kind, label: kind === "hook" ? "" : k.label || (kind === "cta" ? "CTA" : "Body"), text: k.text };
    });
  }
  function proposeNums(parsed, excludeKey) {
    const used = [];
    let next = nextFreeNum(null, excludeKey);
    return parsed.map((k) => {
      if (k.kind !== "hook") return null;
      const sim = similarHook(k.text, excludeKey);
      let p;
      if (sim) p = sim.num;
      else { while (used.indexOf(next) >= 0) next++; p = next++; }
      used.push(p);
      return p;
    });
  }

  /* ---------- Opérations sur le contenu (sur une copie `n`) ---------- */
  // Retire les versions que plus personne n'a, mais garde toujours au moins une version de l'élément.
  function pruneSlot(n, s, key) {
    const vs = s.items.filter((x) => x.key === key);
    const live = vs.filter((x) => (Array.isArray(x.to) ? x.to.length > 0 : n.brokers.some((b) => (x.not || []).indexOf(b.id) < 0)));
    const keep = live.length ? live : vs.slice(0, 1);
    s.items = s.items.filter((x) => x.key !== key || keep.indexOf(x) >= 0);
  }
  function simplify(n, s, key) {
    const vs = s.items.filter((x) => x.key === key);
    if (vs.length !== 1 || !Array.isArray(vs[0].to)) return;
    const aud = audOf(n, s);
    if (aud.length && sameSet(holdOf(n, s, vs[0]), aud)) { vs[0].to = "all"; vs[0].not = []; }
  }
  function applyPatch(x, p) {
    if (p.text != null && p.text !== x.text) {
      if (th(p.text) !== th(x.text)) { x.rev = num(x.rev) + 1; x.ok = []; }
      x.text = p.text;
    }
    if (p.num != null) x.num = p.num;
    if (p.label != null) x.label = p.label;
    if (p.kind) x.kind = p.kind;
  }
  function baseVersion(vs) { return vs.find((x) => !Array.isArray(x.to)) || vs[0]; }

  // Glisser-déposer d'un élément dans son groupe : avant `beforeKey` (sinon après `afterKey`). Ordre unique pour tous.
  function opMoveItem(n, sid, key, beforeKey, afterKey) {
    const s = n.scripts.find((x) => x.id === sid);
    if (!s) return false;
    const slots = [], index = {};
    s.items.forEach((x) => { if (!(x.key in index)) { index[x.key] = slots.length; slots.push([]); } slots[index[x.key]].push(x); });
    if (!(key in index)) return false;
    const moving = slots[index[key]];
    const rest = slots.filter((sl) => sl !== moving);
    let at = beforeKey ? rest.findIndex((sl) => sl[0].key === beforeKey) : -1;
    if (at < 0 && afterKey) { const j = rest.findIndex((sl) => sl[0].key === afterKey); if (j >= 0) at = j + 1; }
    if (at < 0) return false;
    rest.splice(at, 0, moving);
    s.items = [].concat.apply([], rest);
    return true;
  }
  function moveIn(arr, id, beforeId, afterId) {
    const i = arr.indexOf(id);
    if (i < 0) return false;
    const rest = arr.slice(0, i).concat(arr.slice(i + 1));
    let at = beforeId ? rest.indexOf(beforeId) : -1;
    if (at < 0 && afterId) { const j = rest.indexOf(afterId); if (j >= 0) at = j + 1; }
    if (at < 0) return false;
    rest.splice(at, 0, id);
    if (rest.every((x, k) => x === arr[k])) return false;
    rest.forEach((x, k) => { arr[k] = x; });
    return true;
  }
  // Ordre des scripts : un seul ordre, pour tout le monde.
  function opMoveScript(n, sid, beforeSid, afterSid) {
    const ids = n.scripts.map((s) => s.id);
    if (!moveIn(ids, sid, beforeSid, afterSid)) return false;
    const byId = {};
    n.scripts.forEach((s) => { byId[s.id] = s; });
    n.scripts = ids.map((id) => byId[id]);
    return true;
  }
  // Pastille d'un élément : donne ou enlève CETTE version à ce courtier (il garde une seule version par élément).
  function opPill(n, iid, bid) {
    for (const s of n.scripts) {
      const v = s.items.find((x) => x.id === iid);
      if (!v) continue;
      if (!has(s, bid)) return false;
      const vs = s.items.filter((x) => x.key === v.key);
      const held = vs.find((x) => has(x, bid));
      if (held === v) exclude(v, bid);
      else { vs.forEach((x) => { if (x !== v) exclude(x, bid); }); include(v, bid); }
      pruneSlot(n, s, v.key);
      simplify(n, s, v.key);
      return { removed: held === v };
    }
    return false;
  }
  // Pastille d'un script : retiré de ce courtier seul, ou donné avec tout ce que le script donne « à tous ».
  function opScriptPill(n, sid, bid) {
    const s = n.scripts.find((x) => x.id === sid);
    if (!s) return false;
    if (has(s, bid)) { exclude(s, bid); return { removed: true }; }
    include(s, bid);
    uniq(s.items.map((x) => x.key)).forEach((k) => {
      const held = s.items.filter((x) => x.key === k && has(x, bid));
      held.slice(1).forEach((x) => exclude(x, bid));
    });
    return { removed: false };
  }
  // « Version pour… » : une nouvelle version (copie du texte) pour ce courtier, juste sous l'élément ; même numéro HK.
  function opNewVersion(n, iid, bid) {
    for (const s of n.scripts) {
      const v = s.items.find((x) => x.id === iid);
      if (!v) continue;
      if (!has(s, bid)) return false;
      const vs = s.items.filter((x) => x.key === v.key);
      const nv = Object.assign(clone(v), { id: rid("i"), to: [bid], not: [] });
      vs.forEach((x) => exclude(x, bid));
      s.items.splice(s.items.indexOf(vs[vs.length - 1]) + 1, 0, nv);
      pruneSlot(n, s, v.key);
      return nv.id;
    }
    return false;
  }

  /* ---------- Rendu ---------- */
  let renderTimer = 0, ptrDown = false, ptrAt = 0, owed = false, rendering = false;
  const DND = { st: null };
  function scheduleRender() {
    if (renderTimer) return;
    renderTimer = setTimeout(() => {
      renderTimer = 0;
      if (DND.st || (ptrDown && Date.now() - ptrAt < 1500)) { owed = true; return; }
      render();
    }, 0);
  }
  function payDebt() { if (owed) { owed = false; render(); } }
  window.addEventListener("pointerdown", () => { ptrDown = true; ptrAt = Date.now(); }, true);
  window.addEventListener("pointerup", () => { ptrDown = false; if (owed) setTimeout(payDebt, 120); }, true);
  window.addEventListener("pointercancel", () => { ptrDown = false; payDebt(); }, true);
  window.addEventListener("click", () => { if (owed) setTimeout(payDebt, 0); }, true);

  function render() {
    const a = document.activeElement;
    let keep = null;
    if (a && a !== document.body && a.id && root.contains(a)) {
      keep = { id: a.id, s: null, e: null };
      try { if (typeof a.selectionStart === "number") { keep.s = a.selectionStart; keep.e = a.selectionEnd; } } catch (_) {}
    }
    if (keep && S.ui.remap && S.ui.remap.from === keep.id) keep.id = S.ui.remap.to;
    S.ui.remap = null;
    rendering = true;
    try { root.innerHTML = view(); } finally { rendering = false; }
    root.querySelectorAll("textarea.auto").forEach(autosize);
    root.querySelectorAll("input.tin").forEach(fitInput);
    const want = S.ui.focusNext || (keep && keep.id);
    S.ui.focusNext = null;
    if (want) {
      const el = document.getElementById(want);
      if (el) {
        try { el.focus({ preventScroll: true }); } catch (_) {}
        if (keep && want === keep.id && keep.s != null) { try { el.setSelectionRange(keep.s, keep.e); } catch (_) {} }
        else if (el.tagName === "TEXTAREA") { try { const n = el.value.length; el.setSelectionRange(n, n); } catch (_) {} }
      }
    }
  }
  function autosize(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + 3 + "px"; }

  function header(right, left) {
    return `<header class="top"><div class="clap" aria-hidden="true"></div><div class="brand">${left || `<span class="brand-name">Zak Roll</span>`}${right || ""}</div></header>`;
  }
  const shell = (inner, wide, right, left) => `<div class="frame${wide ? " wide" : ""}">${header(right, left)}${inner}</div>`;
  const backLink = () => `<button type="button" class="lnk back" id="b-home" data-act="home"><span aria-hidden="true">←</span> Courtiers</button>`;
  const msg = (t) => `<main><section class="empty"><p>${t}</p></section></main>`;

  function view() {
    if (S.phase === "nodb") return shell(msg("Connecte-toi à Claude avec le courriel invité pour voir ta liste."));
    if (S.phase === "revoked") return shell(msg("Liste indisponible. Recharge la page."));
    if (S.phase !== "ready" || !S.contentLoaded || !S.progressLoaded) return shell(msg("Chargement…"));
    if (S.isOwner && S.ui.panel) return panelView();
    if (S.isOwner && S.route === "tous") return allView();
    const b = currentBroker();
    if (b) return brokerView(b);
    return homeView();
  }

  /* ----- Accueil ----- */
  function homeView() {
    const brokers = C().brokers;
    let inner;
    if (!brokers.length) inner = `<section class="empty"><p>${S.isOwner ? "Aucun courtier." : "Rien pour l'instant."}</p></section>`;
    else {
      let all = "";
      if (S.isOwner) {
        const t = brokers.reduce((a, b) => { const st = stats(b.id); a.done += st.done; a.total += st.total; return a; }, { done: 0, total: 0 });
        const pct = t.total ? Math.round((t.done / t.total) * 100) : 0, left = t.total - t.done;
        all = `<button type="button" class="ccard tous${t.total && !left ? " is-complete" : ""}" id="b-go-tous" data-act="go" data-id="tous" aria-label="Tous${NB}: ${left} à faire">
          <span class="cname">Tous</span><span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span><span class="cstate">${t.total && !left ? "Complété" : left + " à faire"}</span></button>`;
      }
      inner = `<div class="cgrid">${all}${brokers.map((b) => {
        const st = stats(b.id);
        const complete = st.total > 0 && st.left === 0;
        const pct = st.total ? Math.round((st.done / st.total) * 100) : 0;
        const state = complete ? "Complété" : st.left + " à faire";
        return `<button type="button" class="ccard${complete ? " is-complete" : ""}" id="b-go-${esc(b.id)}" data-act="go" data-id="${esc(b.id)}" aria-label="${esc(b.name)}${NB}: ${esc(state.toLowerCase())}">
          <span class="cname">${esc(b.name)}</span>
          <span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span>
          <span class="cstate">${esc(state)}</span>
        </button>`;
      }).join("")}</div>`;
    }
    const unknown = S.route && !brokers.some((b) => b.id === S.route) && !(S.isOwner && S.route === "tous");
    const note = unknown ? `<p class="note">Lien inconnu${NB}: #${esc(S.route)}</p>` : "";
    return shell(`<main class="home">${note}<h1 class="hi">Courtiers</h1>${inner}</main>`, false, homeTools());
  }

  /* ----- Page d'un courtier, et vue « Tous » (propriétaire) ----- */
  // Préférences de cet appareil : la vue (Cartes / Texte) et les bulles ouvertes ou fermées.
  const VIEW_KEY = "clapZak.vue", BUB_KEY = "clapZak.bulles";
  function readPref(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (_) { return null; } }
  function writePref(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
  let viewMode = readPref(VIEW_KEY) === "texte" ? "texte" : "cartes";
  let bub = (() => { const o = readPref(BUB_KEY); return o && typeof o === "object" && !Array.isArray(o) ? o : {}; })();

  // Ordre de lecture : les hooks, puis le body, puis le CTA.
  function ordered(items) {
    const rank = (it) => (it.kind === "hook" ? 0 : it.kind === "body" ? 1 : 2);
    return items.map((it, i) => [it, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map((x) => x[0]);
  }
  function scriptDone(bid, items) {
    const hooks = items.filter((it) => it.kind === "hook");
    const n = hooks.filter((it) => isDone(bid, it)).length;
    return { n, total: hooks.length, done: hooks.length > 0 && n === hooks.length };
  }
  // La version de chaque élément pour ce courtier, éléments encore vides compris (édition).
  function heldItems(s, bid) {
    const seen = {};
    return s.items.filter((it) => { if (!has(it, bid) || seen[it.key]) return false; seen[it.key] = 1; return true; });
  }
  // La première version de chaque élément (vue « Tous »).
  function mainItems(s) {
    const seen = {};
    return s.items.filter((it) => { if (seen[it.key]) return false; seen[it.key] = 1; return true; });
  }
  // Le propriétaire édite en place, dans les deux vues ; le courtier lit et coche.
  const editing = () => S.isOwner;
  const isAll = () => S.isOwner && S.route === "tous";
  // Contexte : le courtier de la page, ou null dans la vue « Tous ».
  const ctxB = () => (isAll() ? null : currentBroker());
  // Scripts affichés : ceux du courtier (b) ou tous (b = null). Seule la première bulle « À faire » est ouverte par défaut.
  function scriptList(b) {
    const ed = editing();
    const src = b ? C().scripts.filter((s) => has(s, b.id)) : C().scripts;
    const list = src.map((s) => ({
      s,
      items: ordered(b ? visibleItems(s, b.id) : mainItems(s).filter((it) => it.text.trim())),
      held: ed ? ordered(b ? heldItems(s, b.id) : mainItems(s)) : null
    })).filter((x) => !b || x.items.length || (x.held && x.held.length));
    list.forEach((x) => { x.st = b ? scriptDone(b.id, x.items) : { n: 0, total: x.items.filter((it) => it.kind === "hook").length, done: false }; });
    const firstTodo = list.find((x) => !x.st.done), who = b ? b.id : "tous";
    list.forEach((x) => {
      x.def = x === firstTodo;
      const v = bub[who + "|" + x.s.id];
      x.open = v && typeof v === "object" && v.d === (x.st.done ? 1 : 0) ? v.o === 1 : x.def;
    });
    return list;
  }
  const brokerScripts = (b) => scriptList(b);
  function toggleBub(sid) {
    const b = ctxB();
    if (!b && !isAll()) return;
    const x = scriptList(b).find((y) => y.s.id === sid);
    if (!x) return;
    const k = (b ? b.id : "tous") + "|" + sid, open = !x.open;
    if (open === x.def) delete bub[k]; else bub[k] = { o: open ? 1 : 0, d: x.st.done ? 1 : 0 };
    writePref(BUB_KEY, bub);
    render();
  }
  function ensureOpen(sid) {
    const b = ctxB();
    if (!b && !isAll()) return;
    const x = scriptList(b).find((y) => y.s.id === sid);
    if (!x || x.open) return;
    bub[(b ? b.id : "tous") + "|" + sid] = { o: 1, d: x.st.done ? 1 : 0 };

  function isOpen(it, done) { return Object.prototype.hasOwnProperty.call(S.ui.fold, it.id) ? S.ui.fold[it.id] : !done; }
  const triBtn = (act, id, open, aria) => `<button type="button" class="tribtn" id="${act === "sfold" ? "sb" : "fold"}-${esc(id)}" data-act="${act}" data-id="${esc(id)}" aria-expanded="${open}" aria-label="${esc(aria || "Ouvrir ou fermer")}"><span class="tri">${ICON.tri}</span></button>`;
  const tickBox = (b, s, it, done, idp, cls) => `<input type="checkbox"${cls ? ` class="${cls}"` : ""} id="${esc(idp + it.id)}" data-act="check" data-sid="${esc(s.id)}" data-iid="${esc(it.id)}"${done ? " checked" : ""}${S.readOnly ? " disabled" : ""} aria-label="${esc(clipName(b.name, s, it))}${NB}: tourné">`;
  // Carte (courtier) : l'en-tête entier ouvre ou ferme.
  function itemCard(b, s, it) {
    const isHook = it.kind === "hook";
    const done = isHook && isDone(b.id, it);
    const redo = isHook && !done && isRedo(b.id, it);

    const body = `<div class="cbody" id="fold-${esc(it.id)}" role="button" tabindex="0" aria-expanded="${open}" data-act="fold" data-id="${esc(it.id)}">${head}${open ? `<p class="txt">${esc(it.text)}</p>` : ""}</div>`;

  function scriptBubble(b, x) {

  // Vue Texte : l'étiquette sur sa ligne (case devant pour un hook, triangle après), le texte dessous.

  // Version imprimable : on choisit d'abord les scripts (tous cochés par défaut) ; un triangle montre le texte.
  const printPicked = (list) => list.filter((x) => !S.ui.printOff[x.s.id]);
  function pickView(b, list) {
    const n = printPicked(list).length, busy = S.ui.pdfBusy;

      const s = x.s, open = !!S.ui.pickOpen[s.id];

      return `<div class="pick${open ? " open" : ""}"><div class="prow"><label class="plabel"><input type="checkbox" class="dck" id="ps-${esc(s.id)}" data-act="psel" data-id="${esc(s.id)}"${S.ui.printOff[s.id] ? "" : " checked"}><span class="slate big">${esc(scriptLabel(s))}</span>${state}</label><button type="button" class="ptri" id="pt-${esc(s.id)}" data-act="pick-fold" data-id="${esc(s.id)}" aria-expanded="${open}" aria-label="Voir ${esc(scriptLabel(s))}"><span class="tri">${ICON.tri}</span></button></div>${open ? `<div class="pprev">${x.items.map((it) => textBlock(b, s, it, false)).join("")}</div>` : ""}</div>`;
    }).join("");

    return `<div class="frame"><div class="pbar"><button type="button" class="lnk back" id="b-pback" data-act="print-close"><span aria-hidden="true">←</span> Retour</button></div><main><div class="picks">${rows}</div><div class="pgo">${btns}</div></main></div>`;

  // « Imprimer » : hors cadre, la vue Impression puis window.print() ; dans le lecteur claude.ai (cadre), le PDF.
  function printGo() {

    if (!framed) {
      S.ui.print = "view";

  // Vue Impression : noir sur blanc, sans contrôle, un script par page.
  function printView(b, list) {

      ? `<button type="button" class="btn sm" id="b-pdf" data-act="pdf"${S.ui.pdfBusy ? " disabled" : ""}>Télécharger le PDF</button>`

    const doc = list.map((x) => `<section class="psec"><h2 class="ph">${esc(scriptLabel(x.s))}</h2>${x.items.map((it) =>

  const viewBar = (show, canPrint) => (show ? `<div class="vbar"><div class="seg" role="group" aria-label="Vue">${[["cartes", "Cartes"], ["texte", "Texte"]].map((m) =>
    `<button type="button" class="segb" id="v-${m[0]}" data-act="view" data-id="${m[0]}" aria-pressed="${viewMode === m[0]}">${m[1]}</button>`).join("")}</div>${canPrint ? `<button type="button" class="lnk subtle" id="b-print" data-act="print-open">Version imprimable</button>` : ""}</div>` : "");
  const newScriptBtn = () => `<button type="button" class="plus" id="b-new-script" data-act="new-script" aria-label="Nouveau script">+</button>`;

    return shell(`${ro}<main>${hero}${viewBar(list.length || ed, readList.length)}${body}</main>`, false, savedTag(), backLink());

  // Vue « Tous » (propriétaire) : l'avancement de chacun, puis tous les scripts et toutes leurs versions.
  function allView() {

  /* ----- PDF (jsPDF, polices de base : texte seulement) ----- */
  function pdfSafe(s) {
    return String(s == null ? "" : s)
      .replace(/[‘’‚ʼ′]/g, "'").replace(/[“”„]/g, '"')
      .replace(/[    ]/g, " ").replace(/…/g, "...").replace(/[‐-―−]/g, "-")
      .replace(/œ/g, "oe").replace(/Œ/g, "OE").replace(/€/g, "EUR")
      .replace(/[^\t\n\r\x20-\x7E -ÿ]/g, "");
  }
  function makePdf(list) {
    const J = window.jspdf && window.jspdf.jsPDF;
    if (typeof J !== "function") throw { code: "nolib" };
    const doc = new J({ unit: "pt", format: "letter" });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 54, maxW = W - 2 * M;
    list.forEach((x, si) => {
      if (si) doc.addPage();
      let y = M;
      const room = (h) => { if (y + h > H - M) { doc.addPage(); y = M; } };
      doc.setFont("helvetica", "bold"); doc.setFontSize(24);
      doc.text(pdfSafe(scriptLabel(x.s)), M, y + 20);
      y += 46;
      x.items.forEach((it) => {
        room(16 + 20);
        doc.setFont("helvetica", "bold"); doc.setFontSize(11);
        doc.text(pdfSafe(itemLabel(it)), M, y + 9);
        y += 17;
        doc.setFont("helvetica", "normal"); doc.setFontSize(14);
        doc.splitTextToSize(pdfSafe(it.text), maxW).forEach((ln) => { room(20); doc.text(ln, M, y + 14); y += 20; });
        y += 16;
      });
    });
    return doc.output("arraybuffer");
  }
  async function savePdf(after) {
    const b = ctxB();
    if ((!b && !isAll()) || !S.dl || S.ui.pdfBusy) return;
    S.ui.pdfBusy = true;
    render();
    try {
      const list = printPicked(scriptList(b).filter((x) => x.items.length));
      if (!list.length) return;
      const data = makePdf(list);
      await S.dl.save({ filename: (b ? b.name : "Tous") + " - scripts.pdf", data });
      if (after) showToast(after, null, 6000);
    } catch (e) {
      const c = e && e.code;
      if (c === "nolib") showToast("PDF indisponible. Imprime depuis le menu de ton navigateur.", null, 6000);
      else if (c === "declined") { /* le courtier a dit non */ }
      else if (c === "rate_limited") showToast("Un téléchargement attend déjà ta réponse.", null, 4000);
      else if (c === "too_large") showToast("PDF trop gros.", null, 4000);
      else if (c === "unavailable" || c === "not_granted" || c === "capability_disabled" || c === "capability_removed") {
        S.dl = null;
        showToast("Téléchargement indisponible ici.", null, 4000);
      } else showToast("PDF non créé.", null, 4000);
    } finally {
      S.ui.pdfBusy = false;
      render();
    }
  }

  /* ----- Édition en place (Édouard seulement) ----- */
  function field(f, id, value, tag, cls, aria, extra) {
    const key = f + ":" + id;
    const v = S.ui.dirty[key] ? S.ui.dirty[key].value : value;
    const domId = "f-" + f + "-" + id;
    if (tag === "textarea") return `<textarea class="${cls} auto" id="${esc(domId)}" data-field="${f}" data-id="${esc(id)}" rows="1" aria-label="${esc(aria)}"${extra || ""}>${esc(v)}</textarea>`;
    return `<input class="${cls}" id="${esc(domId)}" data-field="${f}" data-id="${esc(id)}" value="${esc(v)}" aria-label="${esc(aria)}" autocomplete="off"${extra || ""}>`;
  }
  const fval = (f, id, saved) => (S.ui.dirty[f + ":" + id] ? S.ui.dirty[f + ":" + id].value : saved);
  const ib = (act, id, sym, aria, dis, cls) =>
    `<button type="button" class="ib${cls ? " " + cls : ""}" id="b-${act}-${esc(id)}" data-act="${act}" data-id="${esc(id)}" aria-label="${esc(aria)}" title="${esc(aria)}"${dis ? " disabled" : ""}>${sym}</button>`;

  const savedTag = () => (S.isOwner ? `<span class="saved${Date.now() < S.ui.savedUntil ? " on" : ""}" id="saved" aria-live="polite">Enregistré</span>` : "");
  const homeTools = () => (S.isOwner ? `<button type="button" class="ib" id="b-panel" data-act="panel" aria-label="Équipe et corbeille" title="Équipe et corbeille">${ICON.team}</button>` : "");
  // Poignée de glisser-déposer (souris, doigt après un appui long ; flèches ↑ ↓ au clavier).
  const grip = (kind, id) => `<button type="button" class="grip" id="gr-${kind}-${esc(id)}" data-grip="${kind}" aria-label="${kind === "script" ? "Déplacer le script" : "Déplacer"}">${ICON.grip}</button>`;

  // Code du script : la proposition (prochain numéro libre de la même base) s'affiche en grisé après le curseur.
  function nextCode(excludeSid) {
    const last = C().scripts.filter((s) => s.id !== excludeSid).map((s) => s.code).filter((c) => /\d+$/.test(c)).pop() || "";
    return last ? suggestCode(last, excludeSid) : "";
  }
  // Seulement si la base tapée existe déjà (« EvalM » quand EvalM8 existe → EvalM9).
  function codeSuggestion(sid, typed) {
    const t = String(typed || "").trim();
    if (!t) return nextCode(sid);
    const m = /^(.*?)(\d*)$/.exec(t), base = m[1].toLowerCase();
    if (!base) return "";
    let max = 0, cased = m[1];
    const codes = C().scripts.filter((s) => s.id !== sid).map((s) => s.code);
    S.trash.forEach((x) => { if (x.kind === "script" && x.item && isStr(x.item.code)) codes.push(x.item.code); });
    if (m[2] && !codes.some((c) => isStr(c) && c.toLowerCase() === t.toLowerCase())) return "";
    codes.filter(isStr).forEach((c) => {
      const mm = /^(.*?)(\d+)$/.exec(c);
      if (mm && mm[1].toLowerCase() === base && parseInt(mm[2], 10) > max) { max = parseInt(mm[2], 10); cased = mm[1]; }
    });
    if (!max) return "";
    const sug = (m[1] || cased) + (max + 1);
    return sug === t ? "" : sug;
  }
  function codeGhost(sid, typed) {
    const t = String(typed || ""), sug = codeSuggestion(sid, t);
    if (!sug) return "";
    return sug.toLowerCase().indexOf(t.toLowerCase()) === 0 ? sug.slice(t.length) : "→" + sug;
  }
  function linkHint(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (_) { return ""; } }
  // Pastilles des courtiers : initiale (deux lettres si deux prénoms commencent pareil).
  function initials() {
    const out = {}, bs = C().brokers;
    bs.forEach((b) => {
      const nm = String(b.name || b.id);
      let k = 1;
      while (k < nm.length && bs.some((o) => o !== b && String(o.name || o.id).slice(0, k).toLowerCase() === nm.slice(0, k).toLowerCase())) k++;
      out[b.id] = nm.slice(0, k).toUpperCase();
    });
    return out;
  }
  // Script : gris = ne l'a pas ; noir = l'a ; vert = tout coché. Avec sa fraction.
  function scriptPills(s) {
    const ini = initials();
    return `<div class="spills" role="group" aria-label="Qui a ce script">${C().brokers.map((br) => {
      const on = has(s, br.id), st = on ? scriptDone(br.id, visibleItems(s, br.id)) : null;
      const cls = !on ? "off" : st.done ? "ok" : "on";
      const lab = ini[br.id] + (on ? NB + st.n + "/" + st.total : "");
      return `<button type="button" class="bp ${cls}" id="sp-${esc(s.id)}-${esc(br.id)}" data-act="spill" data-sid="${esc(s.id)}" data-b="${esc(br.id)}" data-name="${esc(br.name)}" title="${esc(br.name)}" aria-pressed="${on}" aria-label="${esc(br.name + (on ? " : " + st.n + "/" + st.total : " : n'a pas ce script"))}">${esc(lab)}</button>`;
    }).join("")}</div>`;
  }
  // Élément (cette version) : gris = ne l'a pas ; noir = l'a ; vert = l'a coché. Pointillé = n'a pas le script.
  function itemPills(s, v) {
    const ini = initials(), vs = s.items.filter((x) => x.key === v.key);
    return C().brokers.map((br) => {
      const sc = has(s, br.id), holds = sc && vs.find((x) => has(x, br.id)) === v;
      const cls = !sc ? "na" : holds ? (v.kind === "hook" && isDone(br.id, v) ? "ok" : "on") : "off";
      const tip = br.name + (sc ? "" : " (n'a pas ce script)");
      return `<button type="button" class="bp ${cls}" id="ip-${esc(v.id)}-${esc(br.id)}" data-act="pill" data-iid="${esc(v.id)}" data-b="${esc(br.id)}" data-name="${esc(tip)}" title="${esc(tip)}" aria-pressed="${holds}"${sc ? "" : " disabled"}>${esc(ini[br.id])}</button>`;
    }).join("");
  }
  // En-tête de bulle : « Zak- » (page d'un courtier) + code + « -env » éditables ; lien raw et compte sur la page d'un courtier.
  function ownerHead(b, x) {
    const s = x.s, sid = esc(s.id);
    const code = fval("s-code", s.id, s.code), env = fval("s-env", s.id, s.env);
    const ghost = codeGhost(s.id, code);
    const opts = envOptions(s.id), open = opts.length > 0;
    const link = b ? safeUrl(s.raw[b.id]) : "";

  /* ---------- Avis (toast) ---------- */

  function writeErrorToast(e) {

    else if (c === "resource_exhausted") showToast("Trop de changements d'un coup. Réessaie.", null, 5000);

  /* ---------- Écritures ---------- */
  async function dbWrite(fn) {
    try { return await fn(); }
    catch (e) {
      if (codeOf(e) !== "unavailable") throw e;
      await sleep(250 + Math.random() * 750);
      return await fn();
    }
  }
  // Contenu : un seul document, une écriture à la fois, la plus récente gagne.
  const cw = { writing: false, next: null, waiters: [] };
  function commitContent(next) {
    S.content = next;
    S.contentJson = canon(next);
    scheduleRender();
    return new Promise((resolve, reject) => {
      cw.next = next;
      cw.waiters.push({ resolve, reject });
      if (!cw.writing) flushContent();
    });
  }
  async function flushContent() {
    cw.writing = true;
    let failed = false;
    while (cw.next) {
      const body = cw.next, waiters = cw.waiters;
      cw.next = null; cw.waiters = [];
      try {
        await dbWrite(() => S.db.doc("content/main").set(body));
        waiters.forEach((w) => w.resolve());
        flashSaved();
      } catch (e) {
        failed = true;
        waiters.forEach((w) => w.reject(e));
        writeErrorToast(e);
      }
    }
    cw.writing = false;
    if (failed) resyncContent();
  }
  async function resyncContent() {
    try {
      const snap = await S.db.doc("content/main").get();
      if (cw.writing || cw.next) return;
      const d = snap.exists ? snap.data() : null;
      S.content = norm(clone(d));
      S.contentJson = canon(S.content);
      scheduleRender();
    } catch (_) {}
  }
  function mutate(fn) {
    if (!S.db) return null;
    const next = norm(clone(S.content)) || emptyContent();
    const r = fn(next);
    if (r === false) return null;
    next.updatedAt = Date.now();
    commitContent(next).catch(() => {});
    return { result: r };
  }
  // « Annuler » générique : revient à l'état d'avant si rien n'a bougé entre-temps.
  function undoAction(prev) {
    const after = S.contentJson;
    return {
      label: "Annuler",
      run: () => {
        if (S.contentJson !== after) { showToast("Trop tard pour annuler."); return; }
        const p = norm(clone(prev)) || emptyContent();
        p.updatedAt = Date.now();
        commitContent(p).catch(() => {});
      }
    };
  }
  function move(arr, i, d) {
    const j = i + d;
    if (i < 0 || j < 0 || j >= arr.length) return false;
    const x = arr.splice(i, 1)[0];
    arr.splice(j, 0, x);
    return true;
  }

  // Progression : un document par courtier, écritures en file par document.
  const pq = {};
  function enqueueProgress(bid, payload) {
    const p = (pq[bid] || Promise.resolve()).catch(() => {}).then(() => writeProgress(bid, payload));
    pq[bid] = p;
    return p;
  }
  async function writeProgress(bid, payload) {
    const ref = S.db.doc("progress/" + bid);
    try {
      await dbWrite(() => ref.update(payload));
    } catch (e) {
      if (codeOf(e) !== "invalid_argument") throw e;
      const snap = await ref.get();
      if (snap.exists) throw e;          // le document existe : c'est un refus d'écriture
      await dbWrite(() => ref.set(payload));
    }
  }
  function setReadOnly() { if (!S.readOnly) { S.readOnly = true; scheduleRender(); } }
  function onProgressError(e) {
    const c = codeOf(e);
    if (c === "invalid_argument") { setReadOnly(); showToast("Pas enregistré" + NB + ": lecture seule.", null, 5000); }
    else writeErrorToast(e);
  }
  let tokenSeq = 0;
  function track(key, val, promise) {
    const token = ++tokenSeq;
    S.pending[key] = { val, token, settled: false };
    scheduleRender();
    promise.then(() => {
      const p = S.pending[key];
      if (p && p.token === token) {
        p.settled = true;
        setTimeout(() => { const q = S.pending[key]; if (q && q.token === token) { delete S.pending[key]; scheduleRender(); } }, 4000);
      }
    }).catch((e) => {
      const p = S.pending[key];
      if (p && p.token === token) delete S.pending[key];
      onProgressError(e);
      scheduleRender();
    });
  }
  function setCheck(bid, s, it, on) {
    if (S.readOnly || !S.db) { scheduleRender(); return; }
    const now = Date.now();
    const val = on ? { h: th(it.text), rev: num(it.rev), at: now } : null;

  // Poubelle d'un élément (une ligne) :

  async function removeItem(iid) {

  // Poubelle d'un script : « Tous » = corbeille ; page d'un courtier = retiré de lui seul si d'autres l'ont, sinon corbeille.
  async function removeScript(sid) {

  async function removeBroker(id) {

  // Un courtier qui revient dans un script : une seule version de chaque élément (la sienne, sinon celle de base).
  function ensureItemsFor(s, b) {

  async function restoreItem(t) {

  // Ajouts
  const RESERVED = ["settings", "sidebar", "customize", "upgrade", "downloads", "tous"];

  // Nouveau script : page d'un courtier = pour lui seul ; « Tous » = toute l'équipe.

    const items = [blank("hook", "", { num: n0 }), blank("body", "Body"), blank("cta", "CTA")];

  // Ajouter un HK, un Body ou un CTA : page d'un courtier = à lui seul ; « Tous » = à tous ceux qui ont le script.
  function addItem(sid, group) {

  // Coller un script complet dans un hook vide : découpé en hooks (numéros proposés), body et CTA.
  function splitPaste(iid, parsed) {

      const s = n.scripts.find((x) => x.id === f.s.id);

  // Champs : enregistrés ~600 ms après la frappe, ou en quittant le champ.
  const timers = {};
  function saveField(key, final) {
    clearTimeout(timers[key]);
    const d = S.ui.dirty[key];
    if (!d) return;
    const f = d.field, id = d.id, raw = d.value, v = raw.trim();
    const done = () => { if (S.ui.dirty[key] === d && (final || raw === v)) delete S.ui.dirty[key]; };
    const revert = () => { if (final) { delete S.ui.dirty[key]; scheduleRender(); } };
    const c = S.content;
    if (!c) return;

    // Lien raw collé dans la petite case : vide = rien ne change ; on referme la case en sortant.
    if (f === "rawset") {

      return;
    }
    if (f === "broker-name" || f === "broker-drive" || f === "common-drive" || f === "app-url" || f === "raw") {
      let cur;
      if (f === "broker-name" || f === "broker-drive") { const b = c.brokers.find((x) => x.id === id); if (!b) { delete S.ui.dirty[key]; return; } cur = f === "broker-name" ? b.name : b.drive; }
      else if (f === "common-drive") cur = c.commonDrive;

      else { const p = id.split("~"); const s = c.scripts.find((x) => x.id === p[0]); if (!s) { delete S.ui.dirty[key]; return; } cur = s.raw[p[1]] || ""; }
      if (v === cur) { done(); return; }
      if (f === "broker-name" && !v) { revert(); return; }

        if (f === "broker-name") n.brokers.find((x) => x.id === id).name = v;
        else if (f === "broker-drive") n.brokers.find((x) => x.id === id).drive = v;
        else if (f === "common-drive") n.commonDrive = v;
        else if (f === "app-url") n.appUrl = v;
        else { const p = id.split("~"); const s = n.scripts.find((x) => x.id === p[0]); if (!s) return false; if (v) s.raw[p[1]] = v; else delete s.raw[p[1]]; }
