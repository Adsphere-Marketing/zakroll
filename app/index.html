      case "copylink": copyLink(id); break;
      case "view": viewMode = id === "texte" ? "texte" : "cartes"; writePref(VIEW_KEY, viewMode); render(); break;
      case "print-open": S.ui.print = "pick"; S.ui.printOff = {}; S.ui.pickOpen = {}; hideToast(); render(); scrollTop(); break;
      case "pick-fold": S.ui.pickOpen[id] = !S.ui.pickOpen[id]; render(); break;
      case "print-go": printGo(); break;
      case "print-close": S.ui.print = S.ui.print === "view" ? "pick" : null; render(); scrollTop(); break;
      case "pdf": savePdf(); break;
      case "spill": {
        const sid = el.dataset.sid, bid = el.dataset.b, sc = findScript(sid);
        if (!sc) break;
        const prev = clone(S.content);
        let res = null;
        const r = mutate((n) => { res = opScriptPill(n, sid, bid); if (!res) return false; });
        if (r && res.removed) showToast(scriptLabel(sc) + " retiré pour " + brokerName(bid) + ".", undoAction(prev));
        break;
      }
      case "pill": {
        const fi = findItem(el.dataset.iid), bid = el.dataset.b;
        if (!fi) break;
        const prev = clone(S.content);
        let res = null;
        const r = mutate((n) => { res = opPill(n, el.dataset.iid, bid); if (!res) return false; });
        if (r && res.removed) showToast(itemLabel(fi.it) + " retiré pour " + brokerName(bid) + ".", undoAction(prev));
        break;
      }
      case "ver": S.ui.verFor = S.ui.verFor === id ? null : id; render(); break;
      case "ver-make": {
        let nid = null;
        const r = mutate((n) => { nid = opNewVersion(n, el.dataset.iid, el.dataset.b); if (!nid) return false; });
        S.ui.verFor = null;
        if (r && nid) S.ui.focusNext = "f-i-text-" + nid;
        render();
        break;
      }
      case "new-script": newScript(); break;
      case "add-item": if (/^(hook|body|cta)$/.test(el.dataset.kind)) addItem(el.dataset.sid, el.dataset.kind); break;
      case "item-trash": removeItem(id); break;
      case "script-trash": removeScript(id); break;
      case "num-edit": {
        S.ui.numEdit = id;
        S.ui.focusNext = "f-i-num-" + id;
        render();
        const inp = document.getElementById("f-i-num-" + id);
        if (inp) { try { inp.select(); } catch (_) {} }
        break;
      }
      case "raw-edit": S.ui.rawEdit = S.ui.rawEdit === id ? null : id; if (S.ui.rawEdit) { const b = currentBroker(); if (b) S.ui.focusNext = "f-rawset-" + id + "~" + b.id; } render(); break;
      case "raw-clear": S.ui.rawEdit = null; setFieldNow("raw", id, ""); break;
      case "info-tog": S.ui.infoOpen[id] = !S.ui.infoOpen[id]; if (S.ui.infoOpen[id]) S.ui.focusNext = "f-s-title-" + id; render(); break;
      case "setnum": S.ui.numEdit = null; setFieldNow("i-num", id, el.dataset.n); break;
      case "setfield": setFieldNow(el.dataset.f, id, el.dataset.v); break;
      case "keep-checks": {
        const bp = S.ui.bump;
        S.ui.bump = null;
        if (bp) {
          mutate((n) => {
            for (const sc of n.scripts) {
              const k = sc.items.find((x) => x.id === bp.iid);
              if (k) { k.ok = uniq((k.ok || []).concat(bp.hashes)); k.rev = Math.min(num(k.rev), bp.rev); return; }
            }
            return false;
          });
        }
        scheduleRender();
        break;
      }
      case "broker-up": case "broker-down":
        mutate((n) => move(n.brokers, n.brokers.findIndex((b) => b.id === id), act === "broker-up" ? -1 : 1)); break;
      case "broker-trash": removeBroker(id); break;
      case "addbroker-open": S.ui.composer = { type: "broker" }; S.ui.focusNext = "d-nb-name"; render(); break;
      case "restore": restoreItem(S.trash.find((t) => t.tid === id)); break;
      case "purge": purge(id); break;
    }
  });

  root.addEventListener("change", (e) => {
    const t = e.target;
    if (t.matches && t.matches('input[type="checkbox"][data-act="psel"]')) {
      if (t.checked) delete S.ui.printOff[t.dataset.id]; else S.ui.printOff[t.dataset.id] = true;
      render();
      return;
    }
    if (!t.matches || !t.matches('input[type="checkbox"][data-act="check"]')) return;
    const b = currentBroker();
    const f = findItem(t.dataset.iid);
    if (!b || !f) return;
    setCheck(b.id, f.s, f.it, t.checked);
  });

  let sugTimer = 0;
  root.addEventListener("input", (e) => {
    const t = e.target;
    if (t.matches && t.matches("textarea.auto")) autosize(t);
    if (t.matches && t.matches("input.tin")) fitInput(t);
    if (t.dataset && t.dataset.draft) { S.ui.drafts[t.dataset.draft] = t.value; return; }
    if (t.dataset && t.dataset.field) {
      const f = t.dataset.field, id = t.dataset.id, key = f + ":" + id;
      S.ui.dirty[key] = { field: f, id, value: t.value };
      clearTimeout(timers[key]);
      // Numéro et lien raw : enregistrés à Entrée ou en sortant du champ.
      if (f !== "i-num" && f !== "rawset") timers[key] = setTimeout(() => saveField(key, false), 600);
      if (f === "s-env") { setEnvOpen({ sid: id, all: false }); const box = document.getElementById("cb-" + id); if (box) box.classList.toggle("noenv", !t.value); }
      if (f === "s-code") {
        const g = document.getElementById("gh-code-" + id), ghost = codeGhost(id, t.value);
        if (g) g.textContent = ghost;
        t.placeholder = ghost ? "" : "code";
        fitInput(t);
      }
      if (f === "i-num") {
        const g = document.getElementById("gh-num-" + id), fi = findItem(id);
        if (g && fi) g.textContent = numGhost(numSugg(fi.it, t.value), t.value);
      }
      if (f === "i-text") {
        clearTimeout(sugTimer);
        sugTimer = setTimeout(() => {
          const el = document.getElementById("hh-" + id), fi = findItem(id);
          if (el && fi) el.innerHTML = hintHtml(fi.it);
        }, 150);
      }
    }
  });

  root.addEventListener("paste", (e) => {
    const t = e.target;
    if (!t.dataset || t.dataset.field !== "i-text" || t.value.trim()) return;
    const f = findItem(t.dataset.id);
    if (!f || f.it.kind !== "hook") return;
    const txt = (e.clipboardData && e.clipboardData.getData("text")) || "";
    const parsed = parseScript(txt);
    if (parsed.length < 2) return;
    e.preventDefault();
    delete S.ui.dirty["i-text:" + t.dataset.id];
    clearTimeout(timers["i-text:" + t.dataset.id]);
    splitPaste(t.dataset.id, parsed);
  });

  // Toucher une proposition ou la liste ne doit pas sortir du champ (au doigt comme à la souris).
  root.addEventListener("mousedown", (e) => {
    if (e.target.closest && e.target.closest(".cbopt, .cbarrow, .sug, .hkhint")) e.preventDefault();
  });
  document.addEventListener("pointerdown", (e) => {
    if (S.ui.envOpen && !(e.target.closest && e.target.closest(".combo"))) setEnvOpen(null);
  }, true);

  root.addEventListener("focusout", (e) => {
    if (rendering) return;
    const t = e.target;
    if (!t.dataset) return;
    if (S.ui.envOpen && t.closest && t.closest(".combo")) {
      const to = e.relatedTarget;
      if (!(to && to.closest && to.closest(".combo"))) setEnvOpen(null);
    }
    if (t.dataset.draft === "nb-name") { setTimeout(addBroker, 0); return; }
    if (!t.dataset.field) return;
    const key = t.dataset.field + ":" + t.dataset.id;
    if (S.ui.dirty[key]) saveField(key, true);
    if (t.dataset.field === "i-num" && S.ui.numEdit === t.dataset.id) { S.ui.numEdit = null; scheduleRender(); }
    if (t.dataset.field === "rawset" && S.ui.rawEdit) { S.ui.rawEdit = null; scheduleRender(); }
  });

  root.addEventListener("keydown", (e) => {
    const t = e.target;
    if (!t.dataset) return;
    if (t.dataset.act === "fold" && t.tagName !== "BUTTON" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleFold(t.dataset.id); return; }
    // Poignée : ↑ ↓ au clavier (secours du glisser-déposer).
    if (t.dataset.grip && (e.key === "ArrowUp" || e.key === "ArrowDown")) { e.preventDefault(); keyMove(t, e.key === "ArrowUp" ? -1 : 1); return; }
    const f = t.dataset.field;
    // Code : Entrée ou Tab applique la proposition en grisé.
    if (f === "s-code" && (e.key === "Enter" || e.key === "Tab")) {
      const sug = codeGhost(t.dataset.id, t.value) ? codeSuggestion(t.dataset.id, t.value) : "";
      if (sug) { if (e.key === "Enter") e.preventDefault(); setFieldNow("s-code", t.dataset.id, sug); if (e.key === "Enter") t.blur(); return; }
    }
    // Numéro HK : Entrée applique la proposition (sinon le chiffre tapé) ; Échap annule.
    if (f === "i-num") {
      if (e.key === "Enter") {
        e.preventDefault();
        const fi = findItem(t.dataset.id);
        const g = fi ? numSugg(fi.it, t.value) : null;
        S.ui.numEdit = null;
        if (g != null && numGhost(g, t.value)) setFieldNow("i-num", t.dataset.id, String(g));
        else { saveField("i-num:" + t.dataset.id, true); render(); }
        return;
      }
      if (e.key === "Escape") { e.preventDefault(); delete S.ui.dirty["i-num:" + t.dataset.id]; S.ui.numEdit = null; render(); return; }
    }
    if (f === "rawset" && e.key === "Escape") { e.preventDefault(); delete S.ui.dirty["rawset:" + t.dataset.id]; S.ui.rawEdit = null; render(); return; }
    // Liste des environnements au clavier : ↓ ↑ pour parcourir, Échap pour fermer.
    const envIn = f === "s-env";
    if (envIn || t.classList.contains("cbopt")) {
      const sid = t.dataset.id;
      const opts = () => Array.from(document.querySelectorAll("#cbl-" + CSS.escape(sid) + " .cbopt"));
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (envIn && !(S.ui.envOpen && S.ui.envOpen.sid === sid)) setEnvOpen({ sid, all: true });
        const o = opts(), i = o.indexOf(t);
        const n = e.key === "ArrowDown" ? (i < 0 ? 0 : Math.min(i + 1, o.length - 1)) : i - 1;
        if (n >= 0 && o[n]) o[n].focus();
        else if (!envIn) document.getElementById("f-s-env-" + sid).focus();
        return;
      }
      if (e.key === "Escape" && S.ui.envOpen) {
        e.preventDefault();
        setEnvOpen(null);
        if (!envIn) document.getElementById("f-s-env-" + sid).focus();
        return;
      }
      if (envIn && e.key === "Enter") setEnvOpen(null);
    }
    if (t.tagName === "INPUT" && e.key === "Enter") {
      if (f) { e.preventDefault(); t.blur(); return; }
      if (t.dataset.draft === "nb-name") { e.preventDefault(); addBroker(); }
    } else if (e.key === "Escape" && f) {
      const key = f + ":" + t.dataset.id;
      clearTimeout(timers[key]);
      delete S.ui.dirty[key];
      render();
    }
  });

  // Pastilles : le nom complet au survol (title) ou par appui long au doigt (sans changer la pastille).
  const tipEl = document.getElementById("tip");
  let tipT = 0, tipEaten = false;
  root.addEventListener("pointerdown", (e) => {
    const p = e.target.closest && e.target.closest(".bp");
    if (!p || e.pointerType === "mouse") return;
    clearTimeout(tipT);
    tipT = setTimeout(() => {
      tipEaten = true;
      const r = p.getBoundingClientRect();
      tipEl.textContent = p.dataset.name || "";
      tipEl.hidden = false;
      tipEl.style.left = Math.max(8, Math.min(window.innerWidth - 160, r.left)) + "px";
      tipEl.style.top = Math.max(8, r.top - 40) + "px";
      setTimeout(() => { tipEl.hidden = true; }, 1500);
    }, 450);
  });
  ["pointerup", "pointercancel", "pointermove"].forEach((t) => window.addEventListener(t, (e) => {
    if (t === "pointermove" && !(e.pointerType !== "mouse" && Math.abs(e.movementY || 0) + Math.abs(e.movementX || 0) > 6)) return;
    clearTimeout(tipT);
  }, true));
  root.addEventListener("click", (e) => { if (tipEaten && e.target.closest && e.target.closest(".bp")) { tipEaten = false; e.stopPropagation(); e.preventDefault(); } }, true);
  root.addEventListener("contextmenu", (e) => { if (e.target.closest && e.target.closest(".bp")) e.preventDefault(); });

  /* ---------- Glisser-déposer (propriétaire) : bulles de scripts et éléments d'un script ----------
     Souris : on tire la poignée. Doigt : appui long (~0,3 s) sur la poignée, sinon la page défile.
     L'élément se soulève, un trait montre où il ira ; on enregistre une seule fois au relâchement. */
  root.addEventListener("pointerdown", (e) => {
    const g = e.target.closest && e.target.closest(".grip");
    if (!g || !root.contains(g) || (e.pointerType === "mouse" && e.button !== 0)) return;
    const el = g.closest("[data-dnd-el]"), box = el && el.parentElement && el.parentElement.closest("[data-dnd]");
    if (!el || !box || box !== el.parentElement) return;
    const touch = e.pointerType !== "mouse";
    DND.st = { g, el, box, pid: e.pointerId, x0: e.clientX, y0: e.clientY, sy0: window.scrollY, on: false, touch, t: 0, y: e.clientY, before: undefined };
    if (touch) DND.st.t = setTimeout(startDrag, 320);
    else e.preventDefault();
  });
  root.addEventListener("contextmenu", (e) => { if (e.target.closest && e.target.closest(".grip")) e.preventDefault(); });
  window.addEventListener("pointermove", (e) => {
    const d = DND.st;
    if (!d || e.pointerId !== d.pid) return;
    d.y = e.clientY;
    if (!d.on) {
      const far = Math.abs(e.clientY - d.y0) > 8 || Math.abs(e.clientX - d.x0) > 8;
      if (d.touch) { if (far) cancelDrag(); return; }
      if (Math.abs(e.clientY - d.y0) > 4) startDrag(); else return;
    }
    moveDrag();
  }, true);
  window.addEventListener("pointerup", (e) => { if (DND.st && e.pointerId === DND.st.pid) endDrag(true); }, true);
  window.addEventListener("pointercancel", (e) => { if (DND.st && e.pointerId === DND.st.pid) endDrag(false); }, true);
  document.addEventListener("touchmove", (e) => { if (DND.st && DND.st.on && e.cancelable) e.preventDefault(); }, { passive: false });
  window.addEventListener("scroll", () => { if (DND.st && DND.st.on) moveDrag(true); }, { passive: true });

  function cancelDrag() { const d = DND.st; if (d) clearTimeout(d.t); DND.st = null; }
  function startDrag() {
    const d = DND.st;
    if (!d || d.on) return;
    clearTimeout(d.t);
    d.on = true;
    try { d.g.setPointerCapture(d.pid); } catch (_) {}
    d.sibs = Array.from(d.box.children).filter((x) => x.hasAttribute("data-dnd-el"));
    d.el.classList.add("lifted");
    d.line = document.createElement("div");
    d.line.className = "dropline";
    d.box.appendChild(d.line);
    document.body.classList.add("dnd-on");
    if (d.touch && navigator.vibrate) { try { navigator.vibrate(12); } catch (_) {} }
    moveDrag();
  }
  function moveDrag(fromScroll) {
    const d = DND.st;
    if (!d || !d.on) return;
    d.el.style.transform = "translateY(" + (d.y - d.y0 + window.scrollY - d.sy0) + "px)";
    const others = d.sibs.filter((x) => x !== d.el);
    let before = null;
    for (const x of others) { const r = x.getBoundingClientRect(); if (d.y < r.top + r.height / 2) { before = x; break; } }
    d.before = before;
    const br = d.box.getBoundingClientRect();
    const last = others[others.length - 1];
    const top = before ? before.getBoundingClientRect().top - br.top - 6 : last ? last.getBoundingClientRect().bottom - br.top + 3 : 0;
    d.line.style.top = top + "px";
    // Près du bord, la page défile (seulement quand le doigt ou la souris bouge).
    const vh = window.innerHeight || 800;
    if (!fromScroll) { if (d.y < 70) window.scrollBy(0, -14); else if (d.y > vh - 70) window.scrollBy(0, 14); }
  }
  function endDrag(commit) {
    const d = DND.st;
    DND.st = null;
    if (!d) return;
    clearTimeout(d.t);
    if (!d.on) return;
    d.el.classList.remove("lifted");
    d.el.style.transform = "";
    if (d.line) d.line.remove();
    document.body.classList.remove("dnd-on");
    if (commit && d.before !== undefined) {
      const i = d.sibs.indexOf(d.el);
      if (d.before !== (d.sibs[i + 1] || null)) {
        const others = d.sibs.filter((x) => x !== d.el);
        const prevEl = d.before ? others[others.indexOf(d.before) - 1] : others[others.length - 1];
        applyMove(d.box, d.el.dataset.key, d.before ? d.before.dataset.key : null, prevEl ? prevEl.dataset.key : null);
      }
    }
    setTimeout(payDebt, 0);
  }
  // Clavier : déplace d'une place, même logique et même enregistrement que le glisser-déposer.
  function keyMove(g, dir) {
    const el = g.closest("[data-dnd-el]"), box = el && el.parentElement;
    if (!el || !box || !box.hasAttribute("data-dnd")) return;
    const sibs = Array.from(box.children).filter((x) => x.hasAttribute("data-dnd-el"));
    const i = sibs.indexOf(el), j = i + dir;
    if (j < 0 || j >= sibs.length) return;
    const before = dir < 0 ? sibs[j] : sibs[j + 1] || null;
    const after = dir < 0 ? sibs[j - 1] || null : sibs[j];
    S.ui.focusNext = g.id;
    applyMove(box, el.dataset.key, before ? before.dataset.key : null, after ? after.dataset.key : null);
  }
  function applyMove(box, key, beforeKey, afterKey) {
    if (box.dataset.dnd === "item") mutate((n) => { if (!opMoveItem(n, box.dataset.sid, key, beforeKey, afterKey)) return false; });
    else if (box.dataset.dnd === "script") mutate((n) => { if (!opMoveScript(n, key, beforeKey, afterKey)) return false; });
  }

  window.addEventListener("hashchange", () => {
    const r = readHash();
    if (r !== S.route) { S.route = r; S.ui.print = null; S.ui.verFor = null; S.ui.panel = false; S.ui.numEdit = null; S.ui.rawEdit = null; render(); }
  });
  setInterval(() => {
    if (S.phase !== "ready" || document.visibilityState === "hidden") return;
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return;
    scheduleRender();
  }, 60000);

  /* ---------- Démarrage ---------- */
  function onSubError(err, name, resub, retried) {
    const c = codeOf(err);
    if (TERMINAL.indexOf(c) >= 0) { S.phase = "revoked"; scheduleRender(); return; }
    if (c === "unavailable" && !retried) { setTimeout(() => resub(true), 1200 + Math.random() * 1500); return; }
    if (name === "content") S.contentLoaded = true;
    if (name === "progress") S.progressLoaded = true;
    showToast("Mise à jour interrompue. Recharge la page.", null, 6000);
    scheduleRender();
  }
  function subContent(retried) {
    try {
      S.db.doc("content/main").onSnapshot((snap) => {
        const first = !S.contentLoaded;
        S.contentLoaded = true;
        if (cw.writing || cw.next) { if (first) scheduleRender(); return; }
        const data = snap && snap.exists ? norm(clone(snap.data())) : null;
        const j = canon(data);
        if (!first && j === S.contentJson) return;
        S.contentJson = j;
        S.content = data;
        scheduleRender();
      }, (err) => onSubError(err, "content", subContent, retried));
    } catch (err) { onSubError(err, "content", subContent, retried); }
  }
  function subProgress(retried) {
    try {
      S.db.collection("progress").onSnapshot((qs) => {
        const p = {};
        for (const d of qs.docs) if (d.exists) p[d.id] = d.data();
        S.progress = p;
        S.progressLoaded = true;
        for (const k of Object.keys(S.pending)) if (S.pending[k].settled) delete S.pending[k];
        scheduleRender();
      }, (err) => onSubError(err, "progress", subProgress, retried));
    } catch (err) { onSubError(err, "progress", subProgress, retried); }
  }
  function subTrash(retried) {
    try {
      S.db.collection("trash").onSnapshot((qs) => {
        S.trash = qs.docs.filter((d) => d.exists)
          .map((d) => Object.assign({ tid: d.id }, d.data()))
          .sort((a, b) => num(b.deletedAt) - num(a.deletedAt));
        scheduleRender();
      }, (err) => onSubError(err, "trash", subTrash, retried));
    } catch (err) { onSubError(err, "trash", subTrash, retried); }
  }

  async function boot() {
    const W = window.claude;
    if (!W || typeof W.use !== "function") { S.phase = "nodb"; render(); return; }
    W.use("downloads").then((d) => { S.dl = d || null; }, () => { S.dl = null; })
      .then(() => { S.dlKnown = true; scheduleRender(); });
    let db = null, user = null;
    try {
      [db, user] = await Promise.all([
        W.use("db").catch(() => null),
        W.use("user").catch(() => null)
      ]);
    } catch (_) { db = null; }
    if (!db) { S.phase = "nodb"; render(); return; }
    S.db = db; S.user = user;
    let owner = false, can = null;
    if (user) {
      try { [owner, can] = await Promise.all([user.isOwner(), user.can("data.write")]); } catch (_) {}
    }
    S.isOwner = !!owner;
    if (can === false && !S.isOwner) S.readOnly = true;
    S.phase = "ready";
    subContent();
    subProgress();
    if (S.isOwner) subTrash();
    render();
  }
  boot();
})();
</script>

</body></html>
