services:
  zakroll:
    image: node:20-alpine
    container_name: zakroll
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - ./:/app:ro
      - ./data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - DOMAIN=${DOMAIN}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - TEAM_PATH=${TEAM_PATH:-equipe}
      - DRIVE_SCRIPT_URL=${DRIVE_SCRIPT_URL:-}
      - DRIVE_SECRET=${DRIVE_SECRET:-}
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.zakroll.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.zakroll.entrypoints=${ENTRYPOINT:-websecure}"
      - "traefik.http.routers.zakroll.tls=true"
      - "traefik.http.routers.zakroll.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.zakroll.loadbalancer.server.port=8080"
      - "traefik.http.routers.zakroll-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.zakroll-http.entrypoints=${ENTRYPOINT_HTTP:-web}"
      - "traefik.http.routers.zakroll-http.middlewares=zakroll-https"
      - "traefik.http.middlewares.zakroll-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.zakroll-https.redirectscheme.permanent=true"

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK}
